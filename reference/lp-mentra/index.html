<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Living Pages for Mentra Live — concept demo</title>
  </head>
  <body>
    <header id="topbar">
      <div class="brand"><span class="mark">✦</span> Living Pages <em>for Mentra Live · concept demo</em></div>
      <div class="modes">
        <button id="demo-play" class="primary">▶ <span>Play guided demo</span></button>
        <button id="demo-pause" class="when-playing">❚❚ pause</button>
        <select id="demo-speed" class="when-playing" aria-label="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
        <button id="toggle-pipeline" class="quiet">pipeline view</button>
        <button id="mute" class="quiet">🔈 <span>speaker on</span></button>
      </div>
    </header>

    <main id="stage">
      <section class="pane glasses-pane">
        <div class="pane-label"><b>Through the glasses</b> — what the camera sees. The wearer sees no display.</div>
        <div id="feed" class="feed">
          <div id="narration"></div>
          <div class="feed-badge"><i id="led"></i><span id="scan-state">camera on · scanning</span></div>
          <div class="feed-page"><span id="page-indicator"></span></div>
          <div id="speaker-caption"></div>
        </div>
        <div class="glasses-bar">
          <div class="glasses-art" aria-hidden="true">
            <svg viewBox="0 0 220 60"><path d="M10 22 Q 12 12 30 12 L 88 12 Q 100 12 100 26 L 100 34 Q 100 50 80 50 L 40 50 Q 16 50 12 36 Z M120 26 Q 120 12 132 12 L 190 12 Q 208 12 210 22 L 208 36 Q 204 50 180 50 L 140 50 Q 120 50 120 34 Z M100 24 Q 110 18 120 24" fill="none" stroke="#3a352f" stroke-width="2.4" stroke-linejoin="round"/><circle cx="24" cy="20" r="3.4" class="cam"/></svg>
          </div>
          <button id="g-button" title="Tap: capture now · Hold: pause or resume scanning"><span class="dot"></span><span><b>Glasses button</b><em>tap = look now · hold = pause</em></span></button>
          <button id="g-voice"><span>🎙</span><span><b>“Hey Mentra, explain this”</b><em>simulated voice</em></span></button>
          <div class="turns"><button id="turn-prev" aria-label="previous page">‹</button><span>turn page</span><button id="turn-next" aria-label="next page">›</button></div>
        </div>
        <p class="privacy-note">Camera LED is on while scanning. Frames are analysed, then discarded. Nothing is stored.</p>
      </section>

      <section class="pane phone-pane">
        <div class="pane-label"><b>On the phone</b> — the Living Pages miniapp in the Mentra app</div>
        <div id="phone-root"></div>
        <div id="demo-touch"></div>
      </section>
    </main>

    <footer id="pipeline-wrap">
      <div id="pipeline"></div>
      <div id="log"></div>
    </footer>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
